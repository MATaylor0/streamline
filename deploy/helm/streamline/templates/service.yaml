apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamline.fullname" . }}
  labels: {{- include "streamline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "streamline.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
